
name: LGS Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lgs-frontend-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: |
            ghcr.io/lahiru-randika/lgs_dummy:sha-${{ github.sha }}
            ghcr.io/lahiru-randika/lgs_dummy:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Lahiru-Randika/LGS_Dummy
          cache-from: type=gha
          cache-to: type=gha,mode=max
